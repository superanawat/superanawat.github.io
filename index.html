<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Street Food Radar</title>
    
    <!-- ใช้ CDN สำหรับ Leaflet และ Leaflet Search (ปัญหาเรื่องรูปภาพจะหายไปทันที) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.css" />
    
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        /* =========================================
           เพิ่ม CSS สำหรับอนิเมชันนาฬิกาทรายตรงนี้
           ========================================= */
        .hourglass-anim {
            display: inline-block; /* จำเป็นต้องมีเพื่อให้การหมุน (transform) ทำงาน */
            animation: hourglass-flip 2.5s infinite ease-in-out; /* สั่งให้หมุนวนลูป */
        }

        /* จำลองจังหวะการพลิกของนาฬิกาทราย */
        @keyframes hourglass-flip {
            0% { transform: rotate(0deg); }
            40% { transform: rotate(180deg); } /* พลิกกลับหัว */
            50% { transform: rotate(180deg); } /* หยุดพักให้น้ำทรายไหล */
            90% { transform: rotate(360deg); } /* พลิกกลับมาตั้งตรง */
            100% { transform: rotate(360deg); } /* หยุดพัก */
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- โหลด JavaScript ผ่าน CDN ตามลำดับ -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>
    
    <!-- สคริปต์หลักของเรา -->
    <script src="script.js"></script>
</body>
</html>
